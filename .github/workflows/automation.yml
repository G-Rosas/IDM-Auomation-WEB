name: Playwright Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

    inputs:

      jiraIssue:
        description: "Jira Issue"
        required: true
        default: "IDM-1"

      environment:
        description: "Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - cert
          - prod
          - ci

      tag:
        description: "Tag to execute"
        required: true
        default: "@smoke-test"
        type: choice
        options:
          - "@smoke-test"
          - "@login"
          - "@cart"
          - "@checkout"
          - "@negative"
          - "@SCRUM-7"

jobs:
  test:
    name: Test - ${{ matrix.browser }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Install dependencies
        run: mvn clean compile

      - name: Install Playwright Browsers and Dependencies
        run: |
          mvn exec:java \
          -Dexec.mainClass=com.microsoft.playwright.CLI \
          -Dexec.args="install --with-deps"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Show Configuration
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Browser: ${{ matrix.browser }}"
          echo "Tag: ${{ github.event.inputs.tag }}"  

      - name: Execute Tests
        run: mvn clean test -Dcucumber.filter.tags="${{ github.event.inputs.tag }}" -Denv=${{ github.event.inputs.environment }} -Dbrowser=${{ matrix.browser }}

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/surefire-reports/

      - name: Test Summary
        if: always()
        run: |
          echo "## Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.event.inputs.tag }}" >> $GITHUB_STEP_SUMMARY

      - name: Verify Allure Results
        if: always()
        run: |
          echo "Searching for Allure results..."
          find . -type d | grep allure || true    

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/

      - name: Update Jira
        if: success()
        run: |
          curl --request POST \
          --url "${{ secrets.JIRA_URL }}/rest/api/3/issue/${{ github.event.inputs.tag }}/comment" \
          --user "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_TOKEN }}" \
          --header "Accept: application/json" \
          --header "Content-Type: application/json" \
          --data '{
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    {
                      "type": "text",
                      "text": "Automation execution PASSED. Tag: ${{ github.event.inputs.tag }} | Environment: ${{ github.event.inputs.environment }} | Browser: ${{ matrix.browser }}"
                    }
                  ]
                }
              ]
            }
          }'

      - name: Update Jira Failed
        if: failure()
        run: |
          curl --request POST \
          --url "${{ secrets.JIRA_URL }}/rest/api/3/issue/${{ github.event.inputs.tag }}/comment" \
          --user "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_TOKEN }}" \
          --header "Accept: application/json" \
          --header "Content-Type: application/json" \
          --data '{
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    {
                      "type": "text",
                      "text": "Automation execution FAILED. Review GitHub Actions logs."
                    }
                  ]
                }
              ]
            }
          }'