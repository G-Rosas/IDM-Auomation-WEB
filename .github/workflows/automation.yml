name: Playwright Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

    inputs:

      environment:
        description: "Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - cert
          - prod
          - ci

      tag:
        description: "Tag to execute"
        required: true
        default: "@smoke-test"
        type: choice
        options:
          - "@smoke-test"
          - "@login"
          - "@cart"
          - "@checkout"
          - "@negative"

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Install dependencies
        run: mvn clean compile

      - name: Install Playwright Browsers and Dependencies
        run: |
          mvn exec:java \
          -Dexec.mainClass=com.microsoft.playwright.CLI \
          -Dexec.args="install --with-deps"

      - name: Show Configuration
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Browser: ${{ matrix.browser }}"
          echo "Tag: ${{ github.event.inputs.tag }}"  

      - name: Execute Tests
        run: mvn clean test -Dcucumber.filter.tags="${{ github.event.inputs.tag }}" -Denv=${{ github.event.inputs.environment }} -Dbrowser=${{ matrix.browser }}

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: target/